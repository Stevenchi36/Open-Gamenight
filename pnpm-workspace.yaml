packages:
  - apps/*
  - packages/*
  - games
  - games/*

# pnpm blocks dependency build scripts by default (strictDepBuilds: true).
# Every entry here was reviewed: true = allowed, false = deliberately denied.
allowBuilds:
  # esbuild (via tsx) verifies its platform binary.
  esbuild: true
  # Pulled in by sass-embedded; only used by Sass's CLI watch mode, which Vite doesn't use.
  '@parcel/watcher': false
