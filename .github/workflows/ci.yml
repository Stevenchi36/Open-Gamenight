# The same checks as "done" in CLAUDE.md. scripts/deploy.sh doesn't run them, so deploys wait
# for a green main. A pushed v<version> tag also publishes the release (docs/decisions.md).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @ogn/client build
      # Before anything is published: the tag must match package.json and have changelog notes.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node apps/server/scripts/release-notes.ts "$GITHUB_REF_NAME" > /dev/null

  # The Docker image (compose.yaml), published only from a green main (`main`, `sha-<commit>`)
  # or release tag (`latest`, `0.1.0`, `0.1`).
  image:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # A newer push to the same ref cancels an older build, so a tag can't go backwards. Per ref,
    # because a release pushes main and its tag together and neither build may cancel the other.
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Lowercases the name (ghcr.io/stevenchi36/open-gamenight) and adds the OCI labels,
      # including the source label that links the package to this repo.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The GitHub release, with its CHANGELOG.md section as notes. After the image, so the admin
  # Overview (which reads the latest release) never announces a version Docker can't pull yet.
  release:
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          # Nothing to cache: this job installs no packages (v5 tried a pnpm cache and failed on v0.1.0).
          package-manager-cache: false
      - run: node apps/server/scripts/release-notes.ts "$GITHUB_REF_NAME" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
